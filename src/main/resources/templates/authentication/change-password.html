<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{template.html}">
<head><title>Vitta - Change password</title></head>
<body>
<div layout:fragment="content">
    <main class="container"><section class="card form-card">
        <h2 class="title">Change password</h2>
        <div class="alert alert-danger text-center" th:if="${param.error != null}">Invalid password data.</div>
        <form th:action="@{/change-password}" method="post" th:object="${form}">
            <div class="form-group"><label for="currentPassword">Current password:</label><input id="currentPassword" type="password" class="form-control" th:field="*{currentPassword}" required></div>
            <div class="form-group"><label for="newPassword">New password:</label><input id="newPassword" type="password" class="form-control" th:field="*{newPassword}" required></div>
            <div class="form-group"><label for="newPasswordConfirmation">Confirm new password:</label><input id="newPasswordConfirmation" type="password" class="form-control" th:field="*{newPasswordConfirmation}" required></div>
            <button class="btn btn-primary" type="submit">Save</button>
        </form>
    </section></main>
</div>
</body>
</html>
