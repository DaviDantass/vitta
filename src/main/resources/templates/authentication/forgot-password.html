<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{template.html}">
<head><title>Vitta - Forgot password</title></head>
<body><div layout:fragment="content"><main class="container"><section class="card form-card">
    <h2 class="title">Forgot password</h2>
    <div class="alert alert-success" th:if="${submitted}">If the email is registered, a reset link will be sent shortly.</div>
    <form th:action="@{/forgot-password}" method="post" th:object="${form}">
        <div class="form-group"><label for="email">Account email:</label><input id="email" type="email" class="form-control" th:field="*{email}" required></div>
        <button class="btn btn-primary" type="submit">Send reset link</button>
    </form>
</section></main></div></body></html>
