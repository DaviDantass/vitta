<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{template.html}">
<head><title>Vitta - Reset password</title></head>
<body><div layout:fragment="content"><main class="container"><section class="card form-card">
    <h2 class="title">Reset password</h2>
    <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>
    <form th:action="@{/reset-password}" method="post" th:object="${form}">
        <input type="hidden" th:field="*{token}">
        <div class="form-group"><label for="newPassword">New password:</label><input id="newPassword" type="password" class="form-control" th:field="*{newPassword}" minlength="8" required></div>
        <div class="form-group"><label for="newPasswordConfirmation">Confirm new password:</label><input id="newPasswordConfirmation" type="password" class="form-control" th:field="*{newPasswordConfirmation}" minlength="8" required></div>
        <button class="btn btn-primary" type="submit">Save new password</button>
    </form>
</section></main></div></body></html>
