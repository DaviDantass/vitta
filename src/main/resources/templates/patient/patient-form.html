<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template.html}">
<head>
    <title th:text="${form.id == null} ? 'Patient registration' : 'Edit patient'">Patient registration</title>
</head>

<body>
    <div layout:fragment="content">
        <main class="container">
            <section class="card form-card">
                <h2 class="title" th:text="${form.id == null} ? 'Patient registration' : 'Edit patient'">Patient registration</h2>

                <form method="post" action="#" th:action="@{/patients}" th:object="${form}">
                    <input type="hidden" name="id" th:field="*{id}">

                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input id="name" name="name" th:field="*{name}" maxlength="100" autocomplete="name" required>
                        <div class="alert alert-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error!</div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input id="email" name="email" th:field="*{email}" type="email" maxlength="100" autocomplete="email" required>
                        <div class="alert alert-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone:</label>
                        <input id="phone" name="phone" th:field="*{phone}" type="tel" maxlength="20" autocomplete="tel" required>
                        <div class="alert alert-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                    </div>

                    <div class="form-group">
                        <label for="cpf">CPF:</label>
                        <input id="cpf" name="cpf" th:field="*{cpf}" placeholder="000.000.000-00"
                               pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" maxlength="14"
                               aria-describedby="cpfHelp" required>
                        <small id="cpfHelp">Use the format 000.000.000-00.</small>
                        <div class="alert alert-danger" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                    </div>

                    <div class="buttons">
                        <button type="submit" class="btn btn-primary">
                            <img src="/static/assets/plus.png" th:src="@{/assets/plus.png}" alt="Add icon" class="btn-icon">Save
                        </button>

                        <a href="patient-list.html" th:href="@{/patients}" class="btn btn-secondary">
                            <img src="/static/assets/back.png" th:src="@{/assets/back.png}" alt="Back" class="btn-icon">Back
                        </a>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
