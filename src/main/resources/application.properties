spring.application.name=vitta
server.address=0.0.0.0

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vitta}
spring.datasource.username=${DB_USERNAME:vitta}
spring.datasource.password=${DB_PASSWORD:vitta_local}

spring.mvc.hiddenmethod.filter.enabled=true
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

# Local databases may already contain legacy migrations that were removed from
# the working tree; keep Flyway from blocking application startup in that case.
spring.flyway.ignore-migration-patterns=*:missing
